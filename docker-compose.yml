# Local development services for Tessera.
# Start:  docker compose up -d
# Stop:   docker compose down        (your data is kept)
# Reset:  docker compose down -v     (deletes all local data)
services:
  postgres:
    image: postgres:18-alpine
    environment:
      # Local development only. Never use these values in production.
      POSTGRES_USER: tessera
      POSTGRES_PASSWORD: tessera
      POSTGRES_DB: tessera
    ports:
      # Only reachable from this computer, not the rest of the network.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      # Runs once, when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tessera -d tessera']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
