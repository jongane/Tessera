name: CI

on:
  pull_request:
  push:
    branches: [main]

# The robot only needs to read the code.
permissions:
  contents: read

# If you push again while a run is in progress, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Shared
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Also builds packages/shared (its `prepare` script).
      - run: npm ci
      - run: npm run lint -w packages/shared
      - run: npm test -w packages/shared
      - run: npm run build -w packages/shared

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway PostgreSQL for the database and end-to-end tests.
    # Same version as docker-compose.yml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tessera:tessera@localhost:5432/tessera_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      # Also runs `prisma generate` (the api workspace's postinstall script)
      # and builds packages/shared, which the API imports.
      - run: npm ci
      - run: npm run lint -w apps/api
      - run: npm test -w apps/api
      - run: npm run test:db -w apps/api
      - run: npm run test:e2e -w apps/api
      - run: npm run build -w apps/api

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -w apps/web
      - run: npm test -w apps/web
      - run: npm run build -w apps/web

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The real web app, served by the real API, in a real browser.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tessera
          POSTGRES_PASSWORD: tessera
          POSTGRES_DB: tessera_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tessera -d tessera_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tessera:tessera@localhost:5432/tessera_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Builds everything and starts the API (see apps/web/playwright.config.ts).
      - run: npm run test:browser -w apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
